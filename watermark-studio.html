<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComicPur Watermark Studio Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white p-6">
<div class="max-w-4xl mx-auto">
<div class="bg-slate-900 rounded-3xl p-8 shadow-2xl border border-slate-800">
<h1 class="text-4xl font-bold mb-2">ComicPur Watermark Studio Pro</h1>
<p class="text-slate-400 mb-8">Batch watermark + WebP export + custom ZIP naming</p>

<div class="space-y-6">
<div>
<label class="block mb-2 font-semibold">ZIP Name</label>
<input id="zipName" value="Chapter 1"
class="w-full bg-slate-800 rounded-xl p-3 border border-slate-700">
</div>

<div>
<label class="block mb-2 font-semibold">Upload Images</label>
<input id="wmFiles" type="file" multiple accept="image/*"
class="w-full bg-slate-800 rounded-xl p-3 border border-slate-700">
</div>

<div>
<div class="flex justify-between mb-2">
<span>Watermark Opacity</span>
<span id="opacityDisplay">25%</span>
</div>
<input type="range" id="wmOpacity" min="0.05" max="1" step="0.05" value="0.25"
class="w-full"
oninput="opacityDisplay.innerText=Math.round(this.value*100)+'%'">
</div>

<button onclick="runWatermark()"
class="w-full bg-indigo-600 hover:bg-indigo-700 transition rounded-xl p-4 font-bold">
Generate ZIP
</button>

<div id="status" class="text-center text-slate-400"></div>
</div>
</div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

function setStatus(txt){
document.getElementById('status').innerText=txt;
}

const loadImage=(file)=>new Promise(res=>{
const img=new Image();
img.onload=()=>{
URL.revokeObjectURL(img.src);
res(img);
};
img.src=URL.createObjectURL(file);
});

const loadAsset=(src)=>new Promise(res=>{
const img=new Image();
img.onload=()=>res(img);
img.onerror=()=>{
alert("watermark.png not found in root folder");
res(null);
};
img.src=src;
});

async function runWatermark(){
const files=[...document.getElementById('wmFiles').files]
.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));

if(!files.length){
alert("Select images first");
return;
}

const wm=await loadAsset("watermark.png");
if(!wm)return;

const opacity=parseFloat(document.getElementById('wmOpacity').value);
const zip=new JSZip();

for(let i=0;i<files.length;i++){

setStatus(`Processing ${i+1}/${files.length}`);

const img=await loadImage(files[i]);

canvas.width=img.width;
canvas.height=img.height;

ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0);

ctx.globalAlpha=opacity;

const sw=img.width*0.6;
const sh=wm.height*(sw/wm.width);

// center
ctx.drawImage(
wm,
(img.width-sw)/2,
(img.height-sh)/2,
sw,
sh
);

// bottom right
ctx.drawImage(
wm,
img.width-sw-20,
img.height-sh-20,
sw,
sh
);

ctx.globalAlpha=1;

const blob=await new Promise(r=>
canvas.toBlob(r,'image/webp',0.9)
);

zip.file(
`${String(i+1).padStart(3,'0')}.webp`,
blob
);
}

const content=await zip.generateAsync({type:'blob'});

const zipName=document.getElementById('zipName').value.trim() || 'Chapter';

saveAs(content, zipName + '.zip');

setStatus('Done ✅');
}
</script>
</body>
</html>
