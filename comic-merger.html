<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manhwa Merger Pro V2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:20px}
.container{max-width:900px;margin:auto}
.card{background:#1b1b1b;padding:20px;border-radius:12px}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px}
button{background:#4caf50;color:#fff;border:none;cursor:pointer}
.progress{height:24px;background:#333;border-radius:20px;overflow:hidden;margin-top:15px}
.bar{height:100%;width:0;background:#4caf50}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h2>Manhwa Merger Pro V2</h2>

<input id="zipName" placeholder="ZIP Name" value="chapter">

<input id="imageInput" type="file" multiple accept="image/*">

<button onclick="startMerge()">Merge Images</button>

<div class="progress"><div id="bar" class="bar"></div></div>
<p id="status">Idle</p>

</div>
</div>

<script>
const IMAGES_PER_OUTPUT=10;
const CROP_PERCENT=15.6;
const WEBP_QUALITY=0.92;

function p(v){document.getElementById("bar").style.width=v+"%"}
function s(v){document.getElementById("status").textContent=v}

function loadImage(src){
return new Promise((res,rej)=>{
const img=new Image();
img.onload=()=>res(img);
img.onerror=rej;
img.src=src;
});
}

async function loadWatermark(){
try{
return await loadImage("./watermark.png");
}catch(e){
return null;
}
}

  async function startMerge(){
    const fileInput = document.getElementById("imageInput");
    const files = [...fileInput.files]
    .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));

    if(!files.length){alert("Select images");return;}

    // FIX 1: zipName agar khali ho to default value set ki
    const zipName = document.getElementById("zipName").value.trim() || "chapter";

    const zip = new JSZip();
    const watermark = await loadWatermark(); // Agar file nahi mili to null return hoga

    let out = 1;
    let global = 0;
    const total = Math.ceil(files.length / IMAGES_PER_OUTPUT);

    for(let i = 0; i < files.length; i += IMAGES_PER_OUTPUT){

        const batch = files.slice(i, i + IMAGES_PER_OUTPUT);
        const images = [];

        for(const f of batch) images.push(await fileToImage(f));

        let width = Math.max(...images.map(x => x.width));

        let data = [];
        let finalHeight = 0;

        for(const img of images){
            // FIX 2: Check kiya ki kya ye pehli image hai ya nahi
            let crop = (global === 0) ? 0 : Math.floor(img.height * (CROP_PERCENT / 100));
            let scale = width / img.width;
            let drawHeight = Math.floor((img.height - crop) * scale);

            data.push({img, crop, drawHeight});
            finalHeight += drawHeight;
            global++;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = finalHeight;
        const ctx = canvas.getContext("2d");

        let y = 0;
        for(const d of data){
            ctx.drawImage(
                d.img,
                0, d.crop,
                d.img.width, d.img.height - d.crop,
                0, y,
                width, d.drawHeight
            );
            y += d.drawHeight;
        }

        // Watermark logic check
        if(watermark){
            const wmWidth = width * 0.40;
            const ratio = wmWidth / watermark.width;
            const wmHeight = watermark.height * ratio;
            ctx.globalAlpha = 0.50;
            ctx.drawImage(watermark, width - wmWidth - 20, (finalHeight / 2) - (wmHeight / 2), wmWidth, wmHeight);
            ctx.drawImage(watermark, width - wmWidth - 20, finalHeight - wmHeight - 20, wmWidth, wmHeight);
            ctx.globalAlpha = 1.0;
        }

        // Blob create karne ka tareeka
        const blob = await canvasBlob(canvas);
        zip.file(String(out).padStart(3, "0") + ".webp", blob);

        s("Processing batch " + out + " of " + total);
        p(Math.round((out / total) * 100));
        out++;
    }

    const content = await zip.generateAsync({type:"blob"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = zipName + ".zip";
    a.click();

    s("Finished!");
  }

const canvas=document.createElement("canvas");
canvas.width=width;
canvas.height=finalHeight;

const ctx=canvas.getContext("2d");

let y=0;

for(const d of data){

ctx.drawImage(
d.img,
0,d.crop,
d.img.width,d.img.height-d.crop,
0,y,
width,d.drawHeight
);

y+=d.drawHeight;
}

if(watermark){

const wmWidth=width*0.40;
const ratio=wmWidth/watermark.width;
const wmHeight=watermark.height*ratio;

ctx.globalAlpha=0.50;

ctx.drawImage(
watermark,
width-wmWidth-20,
(finalHeight/2)-(wmHeight/2),
wmWidth,
wmHeight
);

ctx.drawImage(
watermark,
width-wmWidth-20,
finalHeight-wmHeight-20,
wmWidth,
wmHeight
);

ctx.globalAlpha=1;
}

zip.file(String(out).padStart(3,"0")+".webp",await canvasBlob(canvas));

p(Math.round((out/total)*100));
out++;
}

const blob=await zip.generateAsync({type:"blob"});

const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=zipName+".zip";
a.click();

s("Finished");
p(100);
}
</script>
</body>
</html>
