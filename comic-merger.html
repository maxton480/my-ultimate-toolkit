<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Merger Pro V3 - Premium Custom Resizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --input-bg: #222227;
            --border-color: #2e2e38;
        }
        
        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center;
            margin: 0;
        }
        .container { 
            max-width: 600px; 
            width: 100%; 
        }
        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            border: 1px solid var(--border-color);
        }
        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 24px;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: -10px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input[type="text"], input[type="number"], select { 
            width: 100%; 
            padding: 12px; 
            background: var(--input-bg); 
            color: var(--text-main);
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            box-sizing: border-box; 
            font-size: 14px;
            transition: border 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        .full-width {
            grid-column: span 2;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 20px; 
            border-radius: 8px; 
            border: none; 
            background: var(--accent-color); 
            color: var(--text-main); 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.2s, transform 0.1s; 
            font-size: 16px; 
        }
        button:hover { 
            background: var(--accent-hover); 
        }
        button:active {
            transform: scale(0.99);
        }
        .inputs-wrapper { 
            max-height: 320px; 
            overflow-y: auto; 
            padding-right: 8px; 
            margin-top: 10px;
        }
        .inputs-wrapper::-webkit-scrollbar { 
            width: 6px; 
        }
        .inputs-wrapper::-webkit-scrollbar-thumb { 
            background: var(--border-color); 
            border-radius: 10px; 
        }
        .inputs-wrapper::-webkit-scrollbar-thumb:hover { 
            background: var(--accent-color); 
        }
        .ep-row { 
            background: var(--input-bg); 
            padding: 12px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            font-size: 14px; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid transparent;
        }
        .ep-row:focus-within {
            border-color: var(--border-color);
        }
        .ep-row input[type="file"] { 
            margin-top: 8px; 
            width: 100%; 
            color: var(--text-muted);
            font-size: 12px;
        }
        .ep-label { 
            font-weight: bold; 
            color: var(--text-main); 
        }
        .progress { 
            height: 8px; 
            background: var(--input-bg); 
            border-radius: 4px; 
            overflow: hidden; 
            margin-top: 25px; 
            display: none;
        }
        .bar { 
            height: 100%; 
            width: 0; 
            background: var(--accent-color); 
            transition: width 0.3s; 
        }
        #status { 
            text-align: center; 
            margin-top: 12px; 
            font-size: 13px; 
            color: var(--text-muted); 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Manhwa Merger Pro V3</h2>
            <p class="subtitle">Smart Auto-Resizer & Manual Joint Tuner</p>
            
            <div class="section-title">1. Resolution & Crop Settings</div>
            <div class="settings-grid">
                <div class="input-group full-width">
                    <label for="zipName">Project / ZIP Name</label>
                    <input id="zipName" type="text" placeholder="e.g. Ishq_Par_Jor_Nahi_Ch1" value="Ishq_Par_Jor_Nahi_Ch1">
                </div>
                
                <div class="input-group">
                    <label for="targetWidth">Target Width (Pixels)</label>
                    <select id="targetWidth" onchange="autoAdjustCrop()">
                        <option value="720" selected>720 px (Optimized / Fast)</option>
                        <option value="1080">1080 px (Original High-Res)</option>
                        <option value="custom">Custom Width</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="cropPixels">Crop Pixels (Per Joint)</label>
                    <input id="cropPixels" type="number" value="365" min="0" placeholder="Pixels to cut">
                </div>

                <div id="customWidthGroup" class="input-group full-width" style="display: none;">
                    <label for="customWidthInput">Enter Custom Width (px)</label>
                    <input id="customWidthInput" type="number" value="720" oninput="autoAdjustCrop()">
                </div>
                
                <div class="input-group full-width">
                    <label for="imgQuality">Output Quality (WebP)</label>
                    <select id="imgQuality">
                        <option value="1.0">100% (Maximum Sharpness / Perfect Text)</option>
                        <option value="0.95" selected>95% (Recommended - Balanced)</option>
                        <option value="0.90">90% (Lightweight / Small Size)</option>
                    </select>
                </div>
            </div>

            <div class="section-title">2. Upload Episodes</div>
            <div class="inputs-wrapper" id="inputsContainer"></div>
            
            <button onclick="startMerge()">Resize & Merge Chapters</button>
            
            <div id="progressContainer" class="progress"><div id="bar" class="bar"></div></div>
            <p id="status">Ready to process</p>
        </div>
    </div>

    <script>
        const TOTAL_EPISODES = 10;
        const IMAGES_PER_OUTPUT = 10; // Splitting into batches of 10 for standard limits

        const inputsContainer = document.getElementById("inputsContainer");
        const zipNameInput = document.getElementById("zipName");
        const targetWidthSelect = document.getElementById("targetWidth");
        const customWidthGroup = document.getElementById("customWidthGroup");
        const customWidthInput = document.getElementById("customWidthInput");
        const cropPixelsInput = document.getElementById("cropPixels");

        // Generate input slots dynamically
        for(let i = 0; i < TOTAL_EPISODES; i++) {
            inputsContainer.innerHTML += `
                <div class="ep-row">
                    <span class="ep-label" id="label${i}">Episode</span>
                    <input id="imageInput${i}" type="file" multiple accept="image/*">
                </div>
            `;
        }

        // Auto adjusts crop pixels dynamically based on width choice to save time
        function autoAdjustCrop() {
            let width = getSelectedWidth();
            if (targetWidthSelect.value === "custom") {
                customWidthGroup.style.display = "flex";
            } else {
                customWidthGroup.style.display = "none";
            }

            if (width === 720) {
                cropPixelsInput.value = "365"; // Calculated 2/3rd of 493px
            } else if (width === 1080) {
                cropPixelsInput.value = "493"; // Original manual value
            } else {
                // Approximate scale ratio for custom widths based on 1080p profile
                let scale = width / 1080;
                cropPixelsInput.value = Math.round(493 * scale);
            }
        }

        function getSelectedWidth() {
            if (targetWidthSelect.value === "custom") {
                return parseInt(customWidthInput.value) || 720;
            }
            return parseInt(targetWidthSelect.value);
        }

        function updateLabels() {
            const zipName = zipNameInput.value;
            const match = zipName.match(/\d+/);
            const startEp = match ? parseInt(match[0]) : 1;

            for(let i = 0; i < TOTAL_EPISODES; i++) {
                document.getElementById(`label${i}`).innerText = `Episode ${startEp + i}`;
            }
        }

        zipNameInput.addEventListener('input', updateLabels);
        updateLabels();

        function p(v) { document.getElementById("bar").style.width = v + "%"; }
        
        function s(v) { 
            document.getElementById("status").textContent = v; 
        }

        function loadImage(src) {
            return new Promise((res, rej) => {
                const img = new Image();
                img.onload = () => res(img);
                img.onerror = rej;
                img.src = src;
            });
        }

        async function fileToImage(file) {
            const url = URL.createObjectURL(file);
            const img = await loadImage(url);
            URL.revokeObjectURL(url);
            return img;
        }

        async function startMerge() {
            let activeEpisodes = [];
            let totalBatches = 0;

            const zipName = zipNameInput.value.trim() || "Merged_Chapters";
            const match = zipName.match(/\d+/);
            const startEp = match ? parseInt(match[0]) : 1;
            
            const targetWidth = getSelectedWidth();
            const cropValue = parseInt(cropPixelsInput.value) || 0;
            const qualityValue = parseFloat(document.getElementById("imgQuality").value);

            for(let i = 0; i < TOTAL_EPISODES; i++) {
                const files = [...document.getElementById(`imageInput${i}`).files]
                    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
                
                if (files.length > 0) {
                    let epNumber = startEp + i;
                    activeEpisodes.push({ epNumber: epNumber, files: files });
                    totalBatches += Math.ceil(files.length / IMAGES_PER_OUTPUT);
                }
            }

            if (activeEpisodes.length === 0) { 
                alert("Bhai, kam se kam kisi ek episode mein images select karo!"); 
                return; 
            }

            document.getElementById("progressContainer").style.display = "block";
            const zip = new JSZip();
            let processedBatches = 0;

            for (let ep of activeEpisodes) {
                let epFolder = zip.folder(`Episode_${ep.epNumber}`);
                let out = 1;
                let global = 0; // Tracks position inside the current episode strip

                for (let i = 0; i < ep.files.length; i += IMAGES_PER_OUTPUT) {
                    const batch = ep.files.slice(i, i + IMAGES_PER_OUTPUT);
                    const images = await Promise.all(batch.map(f => fileToImage(f)));

                    let data = [];
                    let finalHeight = 0;

                    images.forEach(img => {
                        let scale = targetWidth / img.width;
                        let originalDrawnHeight = Math.floor(img.height * scale);
                        
                        // First image of the whole chapter/episode won't crop from top
                        let currentCrop = (global === 0) ? 0 : cropValue;
                        let finalDrawnHeight = originalDrawnHeight - currentCrop;
                        
                        data.push({ img, currentCrop, finalDrawnHeight });
                        finalHeight += finalDrawnHeight;
                        global++;
                    });

                    const canvas = document.createElement("canvas");
                    canvas.width = targetWidth;
                    canvas.height = finalHeight;
                    const ctx = canvas.getContext("2d");

                    let y = 0;
                    data.forEach(d => {
                        // Calculate crop on source image boundaries to maintain exact precision
                        let scale = targetWidth / d.img.width;
                        let originalCropOffset = Math.floor(d.currentCrop / scale);
                        let originalCropHeight = d.img.height - originalCropOffset;

                        ctx.drawImage(
                            d.img, 
                            0, originalCropOffset, d.img.width, originalCropHeight, 
                            0, y, targetWidth, d.finalDrawnHeight
                        );
                        y += d.finalDrawnHeight;
                    });

                    const blob = await new Promise(r => canvas.toBlob(r, "image/webp", qualityValue));
                    epFolder.file(String(out).padStart(3, "0") + ".webp", blob);
                    
                    processedBatches++;
                    p(Math.round((processedBatches / totalBatches) * 100));
                    s(`Processing Episode ${ep.epNumber} - Slice ${out}...`);
                    out++;
                }
            }

            s("Packaging final Master ZIP... please wait");
            const finalZip = await zip.generateAsync({ type: "blob" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(finalZip);
            a.download = zipName + ".zip";
            a.click();
            s("Finished! High quality resized & aligned episodes zipped successfully.");
        }
    </script>
</body>
</html>
